[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "fixit-bot"
version = "0.1.0"
description = "Lateral-thinking diagnostics, trained like a crow"
readme = "PDC.md"
requires-python = ">=3.10"
license = "MIT"

# Zero hard dependencies. anthropic SDK is optional (falls back to urllib).
dependencies = []

[project.optional-dependencies]
api = ["anthropic>=0.39.0"]
dev = ["pytest>=7.0"]

[project.scripts]
fixit = "fixit.cli:main"

[tool.setuptools.packages.find]
include = ["fixit*"]
