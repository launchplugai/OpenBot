# credentials.template.yaml — Credential checklist for OpenBot/OpenClaw EC2
#
# This file is a REFERENCE TEMPLATE. It does NOT get deployed directly.
# Each credential goes into its respective config file as noted below.
#
# After provisioning a new EC2, walk through each item and fill it in
# at the location specified. Never commit actual secrets to git.
#
# ─── OpenClaw Gateway (/root/.openclaw/openclaw.json) ──────────────────────
#
# In the "env" section of openclaw.json:
#
#   ANTHROPIC_API_KEY: "sk-ant-..."
#     Source: https://console.anthropic.com/settings/keys
#     Notes:  MUST be in openclaw.json env, NOT in shell env (~/.bashrc)
#             Shell env causes auto-discovery and silent credit burn.
#             Run fix-anthropic-env.sh after setting.
#
# In the telegram/bot section of openclaw.json:
#
#   telegram_bot_token: "123456:ABC-..."
#     Source: @BotFather on Telegram
#     Bot:    @MarvinAI_open_bot
#
# ─── Auth Profiles (/root/.openclaw/agents/main/agent/auth-profiles.json) ──
#
#   Moonshot/Kimi API Key:
#     Field:  apiKey in the moonshot/kimi profile
#     Source: https://platform.moonshot.cn/console/api-keys
#     Notes:  Powers Kimi K2.5 executive + $web_search
#
#   OpenAI API Key (if used):
#     Field:  apiKey in the openai profile
#     Source: https://platform.openai.com/api-keys
#     Notes:  Powers GPT-4o-mini operations worker
#
# ─── OpenBot Runtime (/etc/openbot/credentials.yaml) ───────────────────────
#
#   github_token: "ghp_..."
#     Source: https://github.com/settings/tokens
#     Scopes: repo (full), read:org
#     Notes:  Used for cloning private repos (DNA, BetApp)
#             File must be owned root:openbot, mode 640
#
# ─── Tailscale ─────────────────────────────────────────────────────────────
#
#   Auth key: "tskey-auth-..."
#     Source: https://login.tailscale.com/admin/settings/keys
#     Usage:  tailscale up --authkey=tskey-auth-XXXXX
#     Notes:  One-time use. Connects EC2 to org tailnet.
#             After joining, the instance gets a stable 100.x.x.x IP.
#
# ─── Verification ──────────────────────────────────────────────────────────
#
# After filling in all credentials, verify with:
#   bash /opt/openbot/scripts/fix-openclaw-gateway.sh --diagnose
#   bash /opt/openbot/scripts/fix-anthropic-env.sh
#   openbot doctor
