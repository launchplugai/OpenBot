# OpenClaw Configuration Example
#
# This shows how to enable the openbot_ssm tool for an agent.
# The tool must be explicitly allowlisted to be available.

# ============================================================
# SECURITY NOTE:
# AWS credentials are NOT configured here.
# The tool uses the AWS SDK default credential chain:
# 1. Environment variables (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY)
# 2. Shared credentials file (~/.aws/credentials)
# 3. SSO configuration
# 4. IAM role (when running on AWS infrastructure)
#
# DO NOT embed credentials in configuration files.
# ============================================================

# Plugin registration
plugins:
  - name: openbot-ssm
    path: "@openbot/openclaw-ssm-tool"
    # Tool configuration (optional - defaults shown)
    config:
      # instanceId: "i-0dd3b26129b0681ce"  # from OPENBOT_INSTANCE_ID env
      # region: "us-east-2"                 # from AWS_REGION env
      # timeoutSeconds: 180
      # pollIntervalMs: 1500
      # maxOutputChars: 50000
      # openbotPath: "/usr/local/bin/openbot"

# Agent configuration
agents:
  # Main automation agent with OpenBot control
  main:
    model: claude-3-5-sonnet-20241022
    system_prompt: |
      You are an automation assistant with access to OpenBot for running tests.
      Use the openbot_ssm tool to check status, trigger test runs, and review logs.

      When tests fail (severity: ERROR), investigate the logs and provide actionable insights.
      Only notify users when severity is WARN or ERROR.

    # Tool allowlist - openbot_ssm must be explicitly listed
    allowed_tools:
      - openbot_ssm
      # - other_tools...

    # Tool-specific settings
    tool_settings:
      openbot_ssm:
        # Automatically check status at conversation start
        auto_status: false
        # Notify on non-OK severity
        notify_on_error: true

  # Read-only monitoring agent (no restart capability)
  monitor:
    model: claude-3-haiku-20240307
    system_prompt: |
      You are a monitoring agent. You can check OpenBot status and view logs,
      but you cannot trigger runs or restart services.

    allowed_tools:
      - openbot_ssm

    tool_settings:
      openbot_ssm:
        # Restrict to read-only actions
        allowed_actions:
          - status
          - logs

# Environment variables (set externally, not in config)
# Required:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (or use IAM role/SSO)
#   AWS_REGION (or OPENBOT_REGION)
#
# Optional:
#   OPENBOT_INSTANCE_ID - Override default instance
#   OPENBOT_TIMEOUT_SECONDS - Command timeout
#   OPENBOT_POLL_INTERVAL_MS - Polling interval
#   OPENBOT_MAX_OUTPUT_CHARS - Output cap
#   OPENBOT_PATH - Path to openbot CLI on EC2
